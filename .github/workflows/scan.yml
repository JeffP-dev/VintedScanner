name: Vinted Scan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SMTP_SERVER: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PSW: ${{ secrets.SMTP_PSW }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          python3 -c "import Config; print('SERVER:', repr(Config.smtp_server)); print('USERNAME:', repr(Config.smtp_username)); print('FROM:', repr(Config.smtp_from))"
          python3 vinted_scanner.py

      - name: Show scanner logs
        if: always()
        run: ls -la && cat vinted_scanner.log 2>&1 || echo "No log file found"

      - name: Commit updated items list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add vinted_items.txt
          git diff --staged --quiet || git commit -m "update seen items"
          git push
